<!doctype html>
<html lang="en">
	<head>
		<title id="title">Blend to Png</title>
		<link rel="icon" type="image/x-icon" href="./logo.png">
		<meta charset="utf-8">

		<style>
			:root {
				--bg-color: #ddb74d;
				--bg-color-dark: #e28800;
				--bg-color-darker: #d06000;
			}

			button {
				background-color: var(--bg-color-dark);
				font-weight: bold;
				font-size: 5ch;
				margin: 0.6ch;
				margin-top: 2ch;
				width: 70%;
				height: 5ch;
			}

			#container {
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
			}

			button:hover {
				background-color: #ffdd48;
				cursor: pointer;
			}

			body {
				background-color: var(--bg-color);
				font-family: Arial;
				overflow-y: scroll;
			}
			body::-webkit-scrollbar {
				width: 0.8em;
				height: 0.8em;
			}
			body::-webkit-scrollbar-thumb {
				background-color: var(--bg-color-dark);
			}
			body::-webkit-scrollbar-thumb:hover {
				background-color: var(--bg-color-darker);;
			}
			body::-webkit-scrollbar-corner {
				background-color: var(--bg-color);
			}
			body::-webkit-scrollbar-track {
				-webkit-box-shadow: inset 0 0 6px rgba(0,0,0,0.3);
			}
		</style>

	</head>

	<body>

		<div id="container">
			<button id="button-1">Blend to Png</button><br>
			<button id="button-2">Png to Blend</button>
		</div>

		<script type="module" src="./scriptPng.js"></script>
				
	</body>
</html>
